<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT@SYSTEM:~// AUTHENTICATION_GATEWAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #030303;
            color: #39ff14; /* Neon Green Text */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Glitch Border Effect Layout */
        .terminal-card {
            background: #070707;
            border: 2px solid #39ff14;
            border-radius: 4px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            position: relative;
        }

        /* Top Window Bar Like Linux Terminal */
        .terminal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: #111;
            border-bottom: 1px solid #39ff14;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #888;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .window-title { margin-left: 5px; color: #39ff14; font-weight: bold; }

        .terminal-body {
            margin-top: 10px;
            text-align: left;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .console-line {
            font-size: 0.85rem;
            margin-bottom: 18px;
            color: #888;
        }

        .console-line span { color: #39ff14; }

        /* Secure Password Shell Prompt Input */
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px dashed #39ff14;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        .prompt-symbol {
            color: #39ff14;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .pass-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            width: 100%;
            outline: none;
            letter-spacing: 2px;
        }

        /* Terminal Execution Access Button */
        .execute-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #39ff14;
            color: #39ff14;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .execute-btn:hover {
            background: #39ff14;
            color: #000;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }

        .error-terminal {
            color: #ff3333;
            font-size: 0.8rem;
            margin-top: 15px;
            text-align: center;
            display: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <div class="terminal-header">
            <span class="dot"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="window-title">bash - session_auth.sh</span>
        </div>

        <div class="terminal-body">
            <h2>System Override</h2>
            <div class="console-line">
                [sys-status]: <span>ONLINE</span><br>
                [node-bridge]: <span>SECURE_TUNNEL_CONNECTED</span><br>
                [security]: <span>LEVEL_ROOT_REQUIRED</span>
            </div>

            <div class="input-wrapper">
                <span class="prompt-symbol">root@system:~#</span>
                <input type="password" class="pass-input" id="passInputField" placeholder="ENTER_ACCESS_KEY" autocomplete="off">
            </div>

            <button class="execute-btn" id="runAuthBtn">> INITIALIZE_BYPASS</button>
            <div class="error-terminal" id="errorConsole">[CRITICAL_ERROR]: ACCESS_DENIED. IP_LOGGED.</div>
        </div>
    </div>

    <script>
        const passInputField = document.getElementById('passInputField');
        const runAuthBtn = document.getElementById('runAuthBtn');
        const errorConsole = document.getElementById('errorConsole');

        async function triggerSystemLogin() {
            const secretKey = passInputField.value.trim();
            if (!secretKey) return;

            try {
                const response = await fetch('/api/users/all-records', {
                    method: 'GET',
                    headers: { 'x-admin-pin': secretKey }
                });

                if (response.ok) {
                    localStorage.setItem('admin_session_token', secretKey);
                    window.location.href = '/admin';
                } else {
                    errorConsole.style.display = 'block';
                    passInputField.value = '';
                }
            } catch (err) {
                errorConsole.innerText = "[CONNECTION_LOST]: TERMINAL SYNC FAILED.";
                errorConsole.style.display = 'block';
            }
        }

        runAuthBtn.addEventListener('click', triggerSystemLogin);
        passInputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSystemLogin(); });
    </script>
</body>
</html>
